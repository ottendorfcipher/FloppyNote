<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FloppyNote</title>
<style>
:root{--bg:#fff;--fg:#000;--border:#e0e0e0;--tab-bg:#f3f3f3;--tab-active:#fff;--hover:#f0f0f0;--shadow:rgba(0,0,0,0.1);--accent:#0078d4;--about-bg:#eef0ff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;color:var(--fg);background:var(--bg);height:100vh;display:flex;flex-direction:column;overflow:hidden}
#tabs{display:flex;background:var(--tab-bg);border-bottom:1px solid var(--border);padding:4px 4px 0;gap:2px;overflow-x:auto;flex-shrink:0}
.tab{background:var(--tab-bg);border:1px solid var(--border);border-bottom:none;padding:6px 10px;border-radius:4px 4px 0 0;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap;user-select:none}
.tab.active{background:var(--tab-active)}
.tab:hover{background:var(--hover)}
.tab .x{padding:0 2px;border-radius:2px}
.tab .x:hover{background:rgba(0,0,0,0.15)}
.menubar{display:flex;background:var(--bg);border-bottom:1px solid var(--border);padding:2px 4px;flex-shrink:0}
.menu{position:relative}
.mbtn{background:0;border:0;padding:4px 10px;cursor:pointer;font-size:13px;border-radius:3px}
.mbtn:hover,.mbtn.open{background:var(--hover)}
.drop{position:absolute;top:100%;left:0;background:var(--bg);border:1px solid var(--border);box-shadow:0 4px 12px var(--shadow);min-width:180px;z-index:100;display:none;border-radius:4px;margin-top:1px}
.drop.show{display:block}
.mitem{display:flex;align-items:center;padding:6px 12px;cursor:pointer;gap:10px;width:100%;border:0;background:0;text-align:left;font-size:13px;color:var(--fg)}
.mitem:hover{background:var(--hover)}
.mitem .ic{width:14px;text-align:center;flex-shrink:0}
.mitem .ck{margin-left:auto;width:14px;text-align:center}
.sep{height:1px;background:var(--border);margin:3px 0}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
#editor{flex:1;width:100%;border:0;outline:0;padding:12px;font-family:'Consolas','Monaco',monospace;font-size:14px;resize:none;background:var(--bg);color:var(--fg);line-height:1.5}
#welcome{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--bg) 0%,var(--about-bg) 100%);position:relative;gap:12px}
#welcome.on{display:flex}
#welcome img{max-width:70%;max-height:65vh;object-fit:contain}
#welcome h1{font-size:28px;font-weight:300;letter-spacing:2px;color:#555;margin:0}
#status{display:flex;justify-content:space-between;padding:3px 10px;background:var(--bg);border-top:1px solid var(--border);font-size:11px;color:#888;flex-shrink:0}
#status.hide{display:none}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.25);z-index:200;align-items:center;justify-content:center}
#modal.on{display:flex}
.mbox{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:20px;width:380px;box-shadow:0 6px 20px var(--shadow)}
.mbox h3{margin-bottom:14px;font-size:15px}
.mbox input{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:13px;margin-bottom:8px;color:var(--fg);background:var(--bg)}
.mbox .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.btn{padding:5px 14px;border:1px solid var(--border);border-radius:4px;background:var(--bg);cursor:pointer;font-size:13px;color:var(--fg)}
.btn:hover{background:var(--hover)}
.btn.p{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.p:hover{opacity:.9}
</style>
</head>
<body>

<div id="tabs"></div>

<div class="menubar">
  <div class="menu">
    <button class="mbtn" id="mb-file">File</button>
    <div class="drop" id="dd-file">
      <button class="mitem" data-a="new"><span class="ic">+</span>New Tab</button>
      <button class="mitem" data-a="open"><span class="ic">&#128194;</span>Open&hellip;</button>
      <button class="mitem" data-a="save"><span class="ic">&#128190;</span>Save</button>
      <button class="mitem" data-a="saveAs"><span class="ic">&#128190;</span>Save As&hellip;</button>
      <div class="sep"></div>
      <button class="mitem" data-a="closeTab"><span class="ic">&times;</span>Close Tab</button>
    </div>
  </div>
  <div class="menu">
    <button class="mbtn" id="mb-edit">Edit</button>
    <div class="drop" id="dd-edit">
      <button class="mitem" data-a="undo"><span class="ic">&#8630;</span>Undo</button>
      <button class="mitem" data-a="redo"><span class="ic">&#8631;</span>Redo</button>
      <div class="sep"></div>
      <button class="mitem" data-a="cut"><span class="ic">&#9986;</span>Cut</button>
      <button class="mitem" data-a="copy"><span class="ic">&#9138;</span>Copy</button>
      <button class="mitem" data-a="paste"><span class="ic">&#128203;</span>Paste</button>
      <div class="sep"></div>
      <button class="mitem" data-a="find"><span class="ic">&#128269;</span>Find &amp; Replace&hellip;</button>
      <div class="sep"></div>
      <button class="mitem" data-a="selectAll"><span class="ic">&#11036;</span>Select All</button>
      <button class="mitem" data-a="date"><span class="ic">&#128336;</span>Insert Date/Time</button>
    </div>
  </div>
  <div class="menu">
    <button class="mbtn" id="mb-view">View</button>
    <div class="drop" id="dd-view">
      <button class="mitem" data-a="zoomIn"><span class="ic">+</span>Zoom In</button>
      <button class="mitem" data-a="zoomOut"><span class="ic">&minus;</span>Zoom Out</button>
      <button class="mitem" data-a="zoomReset"><span class="ic">&#8635;</span>Reset Zoom</button>
      <div class="sep"></div>
      <button class="mitem" data-a="wrap"><span class="ic"></span>Word Wrap<span class="ck" id="ck-wrap"></span></button>
      <button class="mitem" data-a="statusBar"><span class="ic"></span>Status Bar<span class="ck" id="ck-status">&#10003;</span></button>
    </div>
  </div>
</div>

  <span id="st-pos">Ln 1, Col 1</span>
  <span id="st-info">UTF-8 &middot; 100%</span>
</div>

<div id="modal">
  <div class="mbox">
    <h3>Find &amp; Replace</h3>
    <input id="fi" type="text" placeholder="Find&hellip;">
    <input id="ri" type="text" placeholder="Replace with&hellip;">
    <div class="btns">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="doReplaceAll()">Replace All</button>
      <button class="btn" onclick="doReplace()">Replace</button>
      <button class="btn p" onclick="doFind()">Find</button>
    </div>
  </div>
</div>

<script>
var S = {
  tabs: [],
  active: null,
  zoom: 100,
  wrap: false,
  statusBar: true
};

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function makeTab(content, title, path, welcome) {
  return {
    id: uid(),
    title: title || 'Untitled',
    content: content || '',
    path: path || null,
    handle: null,
    dirty: false,
    welcome: !!welcome,
    undo: [],
    redo: [],
    scroll: 0,
    line: 1,
    col: 1
  };
}

function activeTab() {
  for (var i = 0; i < S.tabs.length; i++) {
    if (S.tabs[i].id === S.active) return S.tabs[i];
  }
  return null;
}

function persist() {
  try {
    localStorage.setItem('fn3', JSON.stringify({
      tabs: S.tabs.map(function(t) {
        return { id: t.id, title: t.title, content: t.content,
                 path: t.path, dirty: t.dirty, scroll: t.scroll,
                 line: t.line, col: t.col, welcome: t.welcome };
      }),
      active: S.active,
      zoom: S.zoom,
      wrap: S.wrap,
      statusBar: S.statusBar
    }));
  } catch(e) {}
}

function restore() {
  try {
    var raw = localStorage.getItem('fn3');
    if (!raw) return;
    var d = JSON.parse(raw);
    if (!d) return;
    S.tabs = (d.tabs || []).map(function(t) {
      var tab = makeTab(t.content, t.title, t.path, t.welcome);
      tab.id    = t.id;
      tab.dirty = t.dirty;
      tab.scroll = t.scroll || 0;
      tab.line   = t.line || 1;
      tab.col    = t.col  || 1;
      return tab;
    });
    S.active    = d.active || null;
    S.zoom      = d.zoom   || 100;
    S.wrap      = !!d.wrap;
    S.statusBar = d.statusBar !== false;
  } catch(e) {}
}

var ed        = document.getElementById('editor');
var welcomeEl = document.getElementById('welcome');
var statusEl  = document.getElementById('status');

function render() {
  renderTabs();
  renderEditor();
  renderStatus();
  persist();
}

function escH(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderTabs() {
  var html = '';
  for (var i = 0; i < S.tabs.length; i++) {
    var t = S.tabs[i];
    var icon = t.welcome ? '&#128221; ' : '';
    var label = t.dirty ? '&#9679; ' : '';
    html += '<div class="tab' + (t.id === S.active ? ' active' : '') +
      '" data-id="' + escH(t.id) + '" title="' + escH(t.title) + '">' +
      '<span>' + icon + label + escH(t.title.slice(0, 20)) + '</span>' +
      '<span class="x" data-close="' + escH(t.id) + '">&times;</span></div>';
  }
  document.getElementById('tabs').innerHTML = html;
}

function renderEditor() {
  var t = activeTab();
  if (!t) {
    ed.style.display = 'none';
    welcomeEl.classList.remove('on');
    return;
  }
  if (t.welcome) {
    ed.style.display = 'none';
    welcomeEl.classList.add('on');
  } else {
    welcomeEl.classList.remove('on');
    ed.style.display = 'block';
    if (ed.value !== t.content) ed.value = t.content;
    ed.style.fontSize  = (14 * S.zoom / 100) + 'px';
    ed.style.whiteSpace = S.wrap ? 'pre-wrap' : 'pre';
    ed.scrollTop = t.scroll;
  }
  document.getElementById('ck-wrap').textContent   = S.wrap ? '\u2713' : '';
  document.getElementById('ck-status').textContent = S.statusBar ? '\u2713' : '';
}

function renderStatus() {
  statusEl.className = S.statusBar ? '' : 'hide';
  var t = activeTab();
  if (t) {
    document.getElementById('st-pos').textContent  = 'Ln ' + t.line + ', Col ' + t.col;
    document.getElementById('st-info').textContent = 'UTF-8 \u00b7 ' + S.zoom + '%';
  }
}

function newTab() {
  var t = makeTab();
  S.tabs.push(t);
  S.active = t.id;
  render();
  ed.focus();
}

function switchTab(id) {
  saveEditorState();
  S.active = id;
  render();
  var t = activeTab();
  if (t && !t.welcome) ed.focus();
}

function closeTab(id) {
  var idx = -1;
  for (var i = 0; i < S.tabs.length; i++) {
    if (S.tabs[i].id === id) { idx = i; break; }
  }
  if (idx < 0) return;
  var t = S.tabs[idx];
  if (t.dirty && !confirm('Close "' + t.title + '" without saving?')) return;
  S.tabs.splice(idx, 1);
  if (S.active === id) {
    S.active = S.tabs.length ? S.tabs[Math.max(0, idx - 1)].id : null;
  }
  render();
}

function saveEditorState() {
  var t = activeTab();
  if (!t) return;
  t.content = ed.value;
  t.scroll  = ed.scrollTop;
  updateCursor(t);
}

function updateCursor(t) {
  if (!t) t = activeTab();
  if (!t) return;
  var lines = ed.value.slice(0, ed.selectionStart).split('\n');
  t.line = lines.length;
  t.col  = lines[lines.length - 1].length + 1;
}

function pushUndo() {
  var t = activeTab();
  if (!t) return;
  t.undo.push(t.content);
  if (t.undo.length > 100) t.undo.shift();
  t.redo = [];
}

function doUndo() {
  var t = activeTab();
  if (!t || !t.undo.length) return;
  t.redo.push(t.content);
  t.content = t.undo.pop();
  t.dirty = true;
  ed.value = t.content;
  render();
}

function doRedo() {
  var t = activeTab();
  if (!t || !t.redo.length) return;
  t.undo.push(t.content);
  t.content = t.redo.pop();
  t.dirty = true;
  ed.value = t.content;
  render();
}

async function openFile() {
  try {
    var picker = await window.showOpenFilePicker();
    var handle = picker[0];
    var file = await handle.getFile();
    var text = await file.text();
    var t = makeTab(text, file.name, file.name);
    t.handle = handle;
    S.tabs.push(t);
    S.active = t.id;
    render();
    ed.focus();
  } catch(e) {
    if (e.name !== 'AbortError') alert('Open failed: ' + e.message);
  }
}

async function saveFile() {
  var t = activeTab();
  if (!t) return;
  if (!t.handle) { await saveFileAs(); return; }
  try {
    var w = await t.handle.createWritable();
    await w.write(t.content);
    await w.close();
    t.dirty = false;
    render();
  } catch(e) {
    alert('Save failed: ' + e.message);
  }
}

async function saveFileAs() {
  var t = activeTab();
  if (!t) return;
  try {
    var handle = await window.showSaveFilePicker({ suggestedName: t.title });
    t.handle = handle;
    var f = await handle.getFile();
    t.title = f.name;
    t.path  = f.name;
    await saveFile();
  } catch(e) {
    if (e.name !== 'AbortError') alert('Save failed: ' + e.message);
  }
}

function openModal() {
  document.getElementById('modal').classList.add('on');
  document.getElementById('fi').focus();
}

function closeModal() {
  document.getElementById('modal').classList.remove('on');
}

function doFind() {
  var q = document.getElementById('fi').value;
  if (!q) return;
  var pos = ed.value.indexOf(q, ed.selectionEnd);
  if (pos < 0) pos = ed.value.indexOf(q, 0);
  if (pos >= 0) {
    ed.focus();
    ed.setSelectionRange(pos, pos + q.length);
  } else {
    alert('Not found.');
  }
}

function doReplace() {
  var q = document.getElementById('fi').value;
  var r = document.getElementById('ri').value;
  if (!q) return;
  var sel = ed.value.slice(ed.selectionStart, ed.selectionEnd);
  if (sel === q) {
    pushUndo();
    var s = ed.selectionStart;
    ed.value = ed.value.slice(0, s) + r + ed.value.slice(ed.selectionEnd);
    ed.setSelectionRange(s + r.length, s + r.length);
    var t = activeTab();
    if (t) { t.content = ed.value; t.dirty = true; }
    renderTabs();
    persist();
  }
  doFind();
}

function doReplaceAll() {
  var q = document.getElementById('fi').value;
  var r = document.getElementById('ri').value;
  if (!q) return;
  var t = activeTab();
  if (!t) return;
  pushUndo();
  var parts = t.content.split(q);
  var count = parts.length - 1;
  t.content = parts.join(r);
  t.dirty   = true;
  ed.value  = t.content;
  closeModal();
  persist();
  alert('Replaced ' + count + ' occurrence' + (count !== 1 ? 's' : '') + '.');
}

var actions = {
  new:       newTab,
  open:      openFile,
  save:      saveFile,
  saveAs:    saveFileAs,
  closeTab:  function() { closeTab(S.active); },
  undo:      doUndo,
  redo:      doRedo,
  cut:       function() { document.execCommand('cut'); },
  copy:      function() { document.execCommand('copy'); },
  paste:     function() { document.execCommand('paste'); },
  selectAll: function() { ed.focus(); ed.select(); },
  find:      openModal,
  date: function() {
    var t = activeTab();
    if (!t) return;
    pushUndo();
    var dt = new Date().toLocaleString();
    var s  = ed.selectionStart;
    var e2 = ed.selectionEnd;
    ed.value = ed.value.slice(0, s) + dt + ed.value.slice(e2);
    ed.setSelectionRange(s + dt.length, s + dt.length);
    t.content = ed.value;
    t.dirty = true;
    renderTabs();
    persist();
  },
  zoomIn:    function() { S.zoom = Math.min(400, S.zoom + 10); render(); },
  zoomOut:   function() { S.zoom = Math.max(25,  S.zoom - 10); render(); },
  zoomReset: function() { S.zoom = 100; render(); },
  wrap:      function() { S.wrap = !S.wrap; render(); },
  statusBar: function() { S.statusBar = !S.statusBar; render(); }
};

var menuMap = {
  'mb-file': 'dd-file',
  'mb-edit': 'dd-edit',
  'mb-view': 'dd-view'
};

function closeMenus() {
  document.querySelectorAll('.drop').forEach(function(d) { d.classList.remove('show'); });
  document.querySelectorAll('.mbtn').forEach(function(b) { b.classList.remove('open'); });
}

document.addEventListener('click', function(e) {
  var mbtn = e.target.closest('.mbtn');
  if (mbtn) {
    var ddId = menuMap[mbtn.id];
    if (!ddId) return;
    var dd = document.getElementById(ddId);
    var wasOpen = dd.classList.contains('show');
    closeMenus();
    if (!wasOpen) { dd.classList.add('show'); mbtn.classList.add('open'); }
    return;
  }

  var xbtn = e.target.closest('[data-close]');
  if (xbtn) {
    e.stopPropagation();
    closeTab(xbtn.dataset.close);
    return;
  }

  var tab = e.target.closest('.tab');
  if (tab && tab.dataset.id) {
    switchTab(tab.dataset.id);
    return;
  }

  var mitem = e.target.closest('.mitem');
  if (mitem) {
    var a = mitem.dataset.a;
    closeMenus();
    if (a && actions[a]) actions[a]();
    return;
  }

  if (e.target.id === 'modal') { closeModal(); return; }

  if (!e.target.closest('.menubar')) closeMenus();
});

document.addEventListener('keydown', function(e) {
  var mod = e.metaKey || e.ctrlKey;
  if (e.key === 'Escape') { closeModal(); return; }
  if (!mod) return;
  var k = e.key;
  if (k === 'n') { e.preventDefault(); actions.new(); }
  else if (k === 'o') { e.preventDefault(); actions.open(); }
  else if (k === 's' && e.shiftKey) { e.preventDefault(); actions.saveAs(); }
  else if (k === 's') { e.preventDefault(); actions.save(); }
  else if (k === 'w') { e.preventDefault(); actions.closeTab(); }
  else if (k === 'z' && e.shiftKey) { e.preventDefault(); actions.redo(); }
  else if (k === 'z') { e.preventDefault(); actions.undo(); }
  else if (k === 'f' || k === 'h') { e.preventDefault(); actions.find(); }
  else if (k === '=') { e.preventDefault(); actions.zoomIn(); }
  else if (k === '-') { e.preventDefault(); actions.zoomOut(); }
  else if (k === '0') { e.preventDefault(); actions.zoomReset(); }
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'F5') { e.preventDefault(); actions.date(); }
}, true);

var _lastVal = '';

ed.addEventListener('keydown', function(e) {
  var t = activeTab();
  if (!t) return;
  if (!e.metaKey && !e.ctrlKey) {
    if ((e.key.length === 1 || e.key === 'Backspace' || e.key === 'Delete') && ed.value !== _lastVal) {
      pushUndo();
      _lastVal = ed.value;
    }
  }
  if (e.key === 'Tab') {
    e.preventDefault();
    pushUndo();
    var s = ed.selectionStart;
    var end = ed.selectionEnd;
    ed.value = ed.value.slice(0, s) + '\t' + ed.value.slice(end);
    ed.setSelectionRange(s + 1, s + 1);
    t.content = ed.value;
    t.dirty = true;
    renderTabs();
    persist();
  }
});

ed.addEventListener('input', function() {
  var t = activeTab();
  if (!t) return;
  t.content = ed.value;
  t.dirty   = true;
  updateCursor(t);
  renderTabs();
  renderStatus();
  persist();
});

ed.addEventListener('click', function() {
  var t = activeTab();
  if (t) { updateCursor(t); renderStatus(); }
});

ed.addEventListener('keyup', function() {
  var t = activeTab();
  if (t) { updateCursor(t); renderStatus(); }
});

ed.addEventListener('scroll', function() {
  var t = activeTab();
  if (t) t.scroll = ed.scrollTop;
});

window.addEventListener('beforeunload', function(e) {
  var dirty = false;
  for (var i = 0; i < S.tabs.length; i++) {
    if (S.tabs[i].dirty) { dirty = true; break; }
  }
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

var favImg = new Image();
favImg.onload = function() {
  var c = document.createElement('canvas');
  c.width = 32; c.height = 32;
  c.getContext('2d').drawImage(favImg, 0, 0, 32, 32);
  var favIcon = document.createElement('link');
  favIcon.rel = 'icon';
  favIcon.type = 'image/png';
  favIcon.href = c.toDataURL('image/png');
  document.head.appendChild(favIcon);
};
favImg.src = document.querySelector('#welcome img').src;

restore();
if (!S.tabs.length) {
  var w = makeTab('', 'FloppyNote', null, true);
  S.tabs.push(w);
  S.active = w.id;
} else {
  var hasWelcome = false;
  for (var i = 0; i < S.tabs.length; i++) {
    if (S.tabs[i].welcome) { hasWelcome = true; break; }
  }
  if (!hasWelcome) {
    var w2 = makeTab('', 'FloppyNote', null, true);
    S.tabs.unshift(w2);
    S.active = w2.id;
  }
}
if (!S.active && S.tabs.length) S.active = S.tabs[0].id;
render();
</script>
</body>
</html>
